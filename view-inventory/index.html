<!DOCTYPE html>
<html lang="en" data-category="Inventory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Inventory - FVPS</title>
  <link href="../styles.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">FVPS Inventory System</a>
    </div>
  </nav>

  <main class="container mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <select id="filter-equipmenttype" class="form-select w-auto">
        <option value="all" selected>All Types</option>
        <option>Projector</option><option>Visualiser</option><option>Projector Screen</option>
        <option>Desktop</option><option>Laptop</option><option>iPad</option>
        <option>Mobile Cart</option><option>SSOE</option>
      </select>

      <input type="text" id="search-inventory" class="form-control w-auto" placeholder="Search..." />

      <button id="add-item-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#inventoryModal">Add Item</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped inventory-table" id="inventory-table">
        <thead class="table-primary">
          <tr>
            <th>EquipmentType</th><th>Equipment</th><th>Vendor</th><th>BrandModel</th>
            <th>Profile</th><th>Custodian</th><th>AssetNo</th><th>SerialNumber</th>
            <th>Location</th><th>EndDate</th><th>StartDate</th><th>Hostname</th>
            <th>SSOE PO Number</th><th>Cart No</th><th>SanitiseDate</th>
            <th>Duration in Use</th><th>Date Updated</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <form id="inventory-form">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title">Add Inventory Item</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body row g-3 px-4">
              <!-- Left to right input layout -->
              <div class="col-md-4">
                <label class="form-label">EquipmentType</label>
                <select class="form-select" name="EquipmentType" required>
                  <option value="">Select</option>
                  <option>Projector</option><option>Visualiser</option><option>Projector Screen</option>
                  <option>Desktop</option><option>Laptop</option><option>iPad</option>
                  <option>Mobile Cart</option><option>SSOE</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Equipment</label>
                <select class="form-select" name="Equipment">
                  <option value="">Select</option>
                  <option>Desktop</option><option>Laptop</option><option>iPad</option><option>Mobile Cart</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Vendor</label>
                <input type="text" name="Vendor" class="form-control" />
              </div>
              <!-- Add the rest similarly: BrandModel, Profile, Custodian, etc -->
              <!-- ... -->
              <div class="col-md-4">
                <label class="form-label">StartDate</label>
                <input type="date" name="StartDate" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">EndDate</label>
                <input type="date" name="EndDate" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Date Updated</label>
                <input type="text" name="DateUpdated" class="form-control" readonly />
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
